extends: default

ignore: |
  charts/*/templates/
  node_modules/
  web-extension/pnpm-lock.yaml

rules:
  document-start: disable
  braces:
    max-spaces-inside: 1
  # Long commands and URLs can't be wrapped: report, don't fail.
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
