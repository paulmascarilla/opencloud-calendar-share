name: Feature request
description: Propose a new feature or a change in behaviour
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Write this request yourself, in your own words: issues generated by an LLM are closed (see CONTRIBUTING.md).
        Don't start coding before a maintainer approves the issue (label `approved`).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work for the user? Mention API, Helm values or CalDAV behaviour it would change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered
  - type: dropdown
    id: component
    attributes:
      label: Area
      multiple: true
      options:
        - Calendar app (OpenCloud Web)
        - Calendar sharing
        - Event invitations
        - CalDAV / CardDAV client
        - Installation (Helm, Compose)
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you implement it?
      options:
        - Yes, once the issue is approved
        - Maybe, with help
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I wrote this request myself, it was not generated by an AI tool
          required: true
