name: Bug report
description: Something does not work as documented
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Write this report yourself, in your own words: issues generated by an LLM are closed (see CONTRIBUTING.md).
        Security problems: use private vulnerability reporting instead of a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. alice shares the calendar "Work" with bob (read)
        2. bob opens the Calendar app
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: opencloud-calendar-share version
      description: Chart or release version (`helm list -n opencloud`, or CALENDAR_VERSION with Compose)
      placeholder: 0.3.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Helm chart
        - Docker Compose overlay (opencloud-compose)
        - Other
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Calendar app (OpenCloud Web)
        - Calendar sharing
        - Event invitations
        - CalDAV / CardDAV client
        - Installation / upgrade
        - Don't know
    validations:
      required: true
  - type: input
    id: opencloud
    attributes:
      label: OpenCloud version
      placeholder: 4.0.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Browser or CalDAV client
      description: If relevant, with its version
      placeholder: Firefox 150, Thunderbird 140, DAVx⁵ 4.5
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: calshare and Radicale logs around the problem. Remove tokens, passwords and personal data.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I wrote this report myself, it was not generated by an AI tool
          required: true
