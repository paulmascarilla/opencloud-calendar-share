name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/commitlint.sh --message "$TITLE"
      - name: Commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # After a force push (or on a new branch) the "before" commit is unknown: check all commits.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            .github/scripts/commitlint.sh "$BASE..HEAD"
          else
            .github/scripts/commitlint.sh HEAD
          fi

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint==1.38.0
      - run: yamllint --format github .

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: sidecar

  web-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning test/*.sh .github/scripts/*.sh
