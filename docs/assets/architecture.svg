<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
  <title id="t">opencloud-calendar-share architecture</title>
  <desc id="d">Browsers and CalDAV clients reach the OpenCloud proxy, which authenticates users and forwards /caldav and /carddav to Radicale and /calshare to the calshare sidecar, both in one pod with a shared volume. Radicale notifies calshare through a storage hook; calshare uses Radicale's sharing API and OpenCloud's Graph API.</desc>
  <style>
    /* OpenCloud design system color roles (light theme) */
    svg {
      --surface: #ffffff; --container: #f6f8fa; --card: #ffffff; --outline: #bfc8cc; --outline-strong: #70787c;
      --text: #191c1d; --text-variant: #40484c; --primary: #00677f; --chrome: #20434f; --on-chrome: #ffffff;
      --ours: #cfe6f1; --on-ours: #071e26;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* dark theme */
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #191c1d; --container: #1d2021; --card: #272a2c; --outline: #40484c; --outline-strong: #8a9296;
        --text: #e1e3e4; --text-variant: #bfc8cc; --primary: #5cd5fb; --chrome: #b3cad4; --on-chrome: #003543;
        --ours: #344a52; --on-ours: #cfe6f1;
      }
    }
    .bg { fill: var(--surface); }
    .zone { fill: var(--container); stroke: var(--outline); stroke-width: 1; }
    .pod { fill: none; stroke: var(--outline-strong); stroke-width: 1.2; stroke-dasharray: 6 5; }
    .card { fill: var(--card); stroke: var(--outline); stroke-width: 1; }
    .ours { fill: var(--ours); stroke: var(--primary); stroke-width: 1.2; }
    .title { fill: var(--text); font-size: 14px; font-weight: 600; }
    .ours-title { fill: var(--on-ours); font-size: 14px; font-weight: 600; }
    .sub { fill: var(--text-variant); font-size: 11.5px; }
    .ours-sub { fill: var(--on-ours); font-size: 11.5px; opacity: 0.85; }
    .zone-label { fill: var(--text); font-size: 13px; font-weight: 700; }
    .caps { fill: var(--text-variant); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .port { fill: var(--text-variant); font-size: 12px; font-weight: 500; }
    .chip { fill: var(--chrome); }
    .chip-text { fill: var(--on-chrome); font-size: 10px; font-weight: 600; letter-spacing: 0.03em; }
    .flow { fill: none; stroke: var(--primary); stroke-width: 1.6; }
    .flow-soft { fill: none; stroke: var(--outline-strong); stroke-width: 1.4; }
    .dashed { stroke-dasharray: 5 4; }
    .flow-label { fill: var(--primary); font-size: 11px; font-weight: 600; }
    .soft-label { fill: var(--text-variant); font-size: 11px; font-weight: 500; }
    .icon { fill: none; stroke: var(--text-variant); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .ours-icon { fill: none; stroke: var(--on-ours); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .head-primary { fill: var(--primary); }
    .head-soft { fill: var(--outline-strong); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head-primary"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head-soft"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="480" rx="16"/>

  <!-- ===== Users ===== -->
  <text class="caps" x="24" y="52">Users</text>

  <rect class="card" x="20" y="72" width="220" height="90" rx="12"/>
  <!-- browser icon -->
  <g class="icon" transform="translate(38 96)">
    <rect x="0" y="0" width="24" height="20" rx="3"/><path d="M0 6 H24"/><circle cx="4" cy="3" r="0.6"/><circle cx="7.5" cy="3" r="0.6"/>
  </g>
  <text class="title" x="76" y="104">Browser</text>
  <text class="sub" x="76" y="123">OpenCloud Web</text>
  <text class="sub" x="76" y="140">+ Calendar app</text>

  <rect class="card" x="20" y="194" width="220" height="90" rx="12"/>
  <!-- calendar icon -->
  <g class="icon" transform="translate(38 216)">
    <rect x="0" y="3" width="24" height="21" rx="3"/><path d="M0 10 H24 M7 0 V6 M17 0 V6"/><path d="M6 15 H9 M11 15 H14 M16 15 H19 M6 19 H9 M11 19 H14"/>
  </g>
  <text class="title" x="76" y="226">CalDAV clients</text>
  <text class="sub" x="76" y="245">Thunderbird · DAVx⁵ · Apple</text>
  <text class="sub" x="76" y="262">Calendar · any CalDAV app</text>

  <!-- ===== OpenCloud ===== -->
  <rect class="zone" x="300" y="34" width="290" height="352" rx="16"/>
  <text class="zone-label" x="320" y="62">OpenCloud</text>

  <rect class="card" x="320" y="80" width="250" height="92" rx="12"/>
  <!-- shield icon -->
  <g class="icon" transform="translate(336 100)">
    <path d="M11 0 L21 4 V11 C21 17 16.5 21 11 23 C5.5 21 1 17 1 11 V4 Z"/><path d="M7 11.5 L10 14.5 L15.5 8.5"/>
  </g>
  <text class="title" x="370" y="106">Proxy</text>
  <text class="sub" x="370" y="125">OIDC sessions · app tokens</text>
  <text class="sub" x="370" y="142">sets X-Remote-User (user id)</text>

  <rect class="ours" x="320" y="188" width="250" height="80" rx="12"/>
  <!-- app icon -->
  <g class="ours-icon" transform="translate(336 206)">
    <rect x="0" y="0" width="9" height="9" rx="2"/><rect x="13" y="0" width="9" height="9" rx="2"/><rect x="0" y="13" width="9" height="9" rx="2"/><rect x="13" y="13" width="9" height="9" rx="2"/>
  </g>
  <text class="ours-title" x="370" y="214">Web</text>
  <text class="ours-sub" x="370" y="233">Calendar app extension</text>
  <text class="ours-sub" x="370" y="250">/calendar · invitations bell</text>

  <rect class="card" x="320" y="284" width="250" height="80" rx="12"/>
  <!-- people icon -->
  <g class="icon" transform="translate(336 300)">
    <circle cx="8" cy="6" r="4.5"/><path d="M0 22 C0 15 4 12.5 8 12.5 C12 12.5 16 15 16 22"/><path d="M15 2.5 A4 4 0 0 1 15 10.5 M18.5 13.5 C21 14.8 23 17.5 23 22"/>
  </g>
  <text class="title" x="370" y="310">Graph API</text>
  <text class="sub" x="370" y="329">users · people search</text>
  <text class="sub" x="370" y="346">e-mail → user id</text>

  <!-- ===== Helm release ===== -->
  <rect class="pod" x="690" y="34" width="290" height="432" rx="16"/>
  <text class="zone-label" x="710" y="62">Helm release</text>
  <rect class="chip" x="812" y="49" width="58" height="18" rx="9"/>
  <text class="chip-text" x="841" y="61.5" text-anchor="middle">ONE POD</text>

  <rect class="card" x="710" y="80" width="250" height="92" rx="12"/>
  <!-- calendar stack icon -->
  <g class="icon" transform="translate(726 100)">
    <rect x="0" y="3" width="22" height="19" rx="3"/><path d="M0 9 H22 M6 0 V5 M16 0 V5"/>
  </g>
  <text class="title" x="760" y="106">Radicale</text>
  <text class="port" x="830" y="106">:5232</text>
  <text class="sub" x="760" y="125">CalDAV · CardDAV</text>
  <text class="sub" x="760" y="142">calendar sharing (map mode)</text>

  <rect class="ours" x="710" y="240" width="250" height="100" rx="12"/>
  <!-- sync icon -->
  <g class="ours-icon" transform="translate(726 262)">
    <path d="M20 8 A9 9 0 0 0 3.5 5 M2 1 V6 H7"/><path d="M2 14 A9 9 0 0 0 18.5 17 M20 21 V16 H15"/>
  </g>
  <text class="ours-title" x="760" y="266">calshare</text>
  <text class="port" x="827" y="266">:8080</text>
  <text class="ours-sub" x="760" y="285">sharing API (REST)</text>
  <text class="ours-sub" x="760" y="302">invitations agent: guest copies,</text>
  <text class="ours-sub" x="760" y="319">answers, e-mail guests</text>

  <rect class="card" x="710" y="378" width="250" height="70" rx="12"/>
  <!-- volume icon -->
  <g class="icon" transform="translate(728 394)">
    <ellipse cx="10" cy="4" rx="10" ry="4"/><path d="M0 4 V18 C0 20.2 4.5 22 10 22 C15.5 22 20 20.2 20 18 V4"/><path d="M0 11 C0 13.2 4.5 15 10 15 C15.5 15 20 13.2 20 11"/>
  </g>
  <text class="title" x="760" y="404">Volume</text>
  <text class="sub" x="760" y="423">calendars · shares · invitations</text>

  <!-- ===== Flows ===== -->
  <!-- users → proxy -->
  <path class="flow" d="M240 117 H318" marker-end="url(#arrow)"/>
  <text class="flow-label" x="279" y="109" text-anchor="middle">HTTPS</text>
  <path class="flow" d="M240 239 C 282 239, 278 150, 318 150" marker-end="url(#arrow)"/>
  <text class="flow-label" x="270" y="216" text-anchor="middle">CalDAV</text>

  <!-- proxy → Radicale / calshare -->
  <path class="flow" d="M570 112 H708" marker-end="url(#arrow)"/>
  <text class="flow-label" x="640" y="91" text-anchor="middle">/caldav/</text>
  <text class="flow-label" x="640" y="104" text-anchor="middle">/carddav/</text>
  <path class="flow" d="M570 150 C 640 150, 640 290, 708 290" marker-end="url(#arrow)"/>
  <text class="flow-label" x="647" y="226" text-anchor="middle">/calshare/</text>

  <!-- calshare ↔ Radicale -->
  <path class="flow-soft" d="M800 238 V174" marker-end="url(#arrow-soft)"/>
  <text class="soft-label" x="794" y="210" text-anchor="end">sharing API</text>
  <text class="soft-label" x="794" y="224" text-anchor="end">· copies</text>
  <path class="flow-soft dashed" d="M880 174 V238" marker-end="url(#arrow-soft)"/>
  <text class="soft-label" x="886" y="210">storage</text>
  <text class="soft-label" x="886" y="224">hook</text>

  <!-- calshare → Graph -->
  <path class="flow-soft" d="M710 322 C 640 322, 640 330, 572 330" marker-end="url(#arrow-soft)"/>
  <text class="soft-label" x="640" y="346" text-anchor="middle">user lookup</text>

  <!-- pod → volume -->
  <path class="flow-soft" d="M835 340 V376" marker-end="url(#arrow-soft)"/>

  <!-- ===== Legend ===== -->
  <rect class="ours" x="20" y="414" width="16" height="16" rx="4"/>
  <text class="sub" x="44" y="426">this project</text>
  <path class="flow" d="M130 422 H160" marker-end="url(#arrow)"/>
  <text class="sub" x="168" y="426">authenticated user traffic</text>
  <text class="sub" x="20" y="452">Radicale and calshare trust X-Remote-User: only the OpenCloud proxy should reach them.</text>
</svg>
