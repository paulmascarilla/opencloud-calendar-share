{{- if .Values.networkPolicy.enabled }}
# Radicale and calshare trust the X-Remote-User header: only the OpenCloud proxy may talk to them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "calendar.fullname" . }}
  labels:
    {{- include "calendar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "calendar.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.opencloud.podSelector | nindent 14 }}
          {{- if ne (include "calendar.opencloudNamespace" .) .Release.Namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "calendar.opencloudNamespace" . }}
          {{- end }}
      ports:
        - port: caldav
        - port: calshare
    # helm test
    - from:
        - podSelector:
            matchLabels:
              {{- include "calendar.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports:
        - port: caldav
        - port: calshare
{{- end }}
