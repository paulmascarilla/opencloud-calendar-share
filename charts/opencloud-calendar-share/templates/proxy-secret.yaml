# Shared by the OpenCloud proxy (added to every request it forwards) and calshare, which refuses
# requests without it: X-Remote-User cannot be forged even when the pod network is open.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calendar.fullname" . }}-proxy-secret
  labels:
    {{- include "calendar.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ include "calendar.proxySecret" . | b64enc | quote }}
