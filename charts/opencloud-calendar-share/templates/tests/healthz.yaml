apiVersion: v1
kind: Pod
metadata:
  name: {{ include "calendar.fullname" . }}-test
  labels:
    {{- include "calendar.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    # kept after success so `helm test --logs` can show it; replaced on the next run
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      image: {{ include "calendar.calshareImage" . | quote }}
      args:
        - check
        - "http://{{ include "calendar.fullname" . }}:8080/healthz"
        - "{{ include "calendar.fullname" . }}:5232"
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
