apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-proxy
  namespace: opencloud
data:
  proxy.yaml: |
    additional_policies:
      - name: default
        routes:
          - endpoint: /caldav/
            backend: http://radicale:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              X-Script-Name: /caldav
          - endpoint: /.well-known/caldav
            backend: http://radicale:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              X-Script-Name: /caldav
          - endpoint: /carddav/
            backend: http://radicale:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              X-Script-Name: /carddav
          - endpoint: /.well-known/carddav
            backend: http://radicale:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              X-Script-Name: /carddav
          - endpoint: /calshare/
            backend: http://radicale:8080
            remote_user_header: X-Remote-User
            skip_x_access_token: true
